name: Build and publish

# Every push: GitHub compiles the sketches. Pushes to main also publish the
# dashboard website (GitHub Pages) with ready-to-install Bloop firmware.

on:
  push:
    branches-ignore: [status]
  pull_request:
  workflow_dispatch:
  workflow_run:  # rebuild (and republish the website) after a new voice is trained
    workflows: ["Train Bloop's voice"]
    types: [completed]

# One publish at a time; a waiting one is replaced by a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FQBN: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,FlashMode=qio,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc
  ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # ---- Bloop's voice: "Train Bloop's voice" trains it and saves it to the "voice" release ----
      - name: Get Bloop's trained voice
        id: voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/out
          if gh release download voice -R "${{ github.repository }}" -p voice_weights.h -D bloop_room --clobber \
             && gh release download voice -R "${{ github.repository }}" -p voice_samples.json -p voice_test.txt -D training/out --clobber; then
            echo "Using the voice from the voice release"; echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "No trained voice yet - training a quick one here"; echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.voice.outputs.have != 'true'
        with:
          python-version: "3.12"

      - name: Train Bloop's voice (only if there's no saved one)
        if: steps.voice.outputs.have != 'true'
        run: |
          pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python training/train_voice.py

      - name: Check the board's model code matches the trained model
        run: |
          gcc -O2 -Wall -I bloop_room training/test_voice.c -o test_voice -lm
          ./test_voice training/out/voice_test.txt

      - name: Install the ESP32 board package and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_URL"
          arduino-cli lib install "GFX Library for Arduino@1.6.9" "SensorLib@0.3.1" "TCA9554@0.1.2" "XPowersLib@0.2.9"

      - name: Compile the sketches
        run: |
          for sketch in hello_touch bloop_room; do
            echo "::group::$sketch"
            arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir "build/$sketch" "$sketch"
            echo "::endgroup::"
          done
          ls -la build/*

      - name: Put the website and firmware together
        run: |
          mkdir -p _site/firmware
          cp -r site/. _site/
          cp training/out/voice_samples.json _site/voice.json
          echo "{\"repo\":\"${{ github.repository }}\"}" > _site/repo.json
          BOOT_APP0="$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)"
          cp "$BOOT_APP0" _site/firmware/boot_app0.bin
          # Separate parts (not one merged file) so updating never wipes Bloop's saved brain.
          for sketch in bloop_room hello_touch; do
            B=build/$sketch
            cp "$B/$sketch.ino.bootloader.bin" _site/firmware/$sketch-bootloader.bin
            cp "$B/$sketch.ino.partitions.bin" _site/firmware/$sketch-partitions.bin
            cp "$B/$sketch.ino.bin"            _site/firmware/$sketch.bin
          done
          write_manifest() {
            cat > "_site/$1" <<JSON
          {
            "name": "$2",
            "version": "${GITHUB_SHA::7}",
            "new_install_prompt_erase": false,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                { "path": "firmware/$3-bootloader.bin?v=${GITHUB_SHA::7}", "offset": 0 },
                { "path": "firmware/$3-partitions.bin?v=${GITHUB_SHA::7}", "offset": 32768 },
                { "path": "firmware/boot_app0.bin?v=${GITHUB_SHA::7}",  "offset": 57344 },
                { "path": "firmware/$3.bin?v=${GITHUB_SHA::7}", "offset": 65536 }
              ]
            }]
          }
          JSON
          }
          write_manifest manifest.json "Bloop's Room" bloop_room
          write_manifest manifest-hello.json "Screen and touch test" hello_touch
          # Browsers keep GitHub Pages files for 10 minutes. Stamp this build into the
          # page's links so a new build is never mixed up with a cached older one.
          V="${GITHUB_SHA::7}"
          sed -i "s|manifest=\"manifest.json\"|manifest=\"manifest.json?v=$V\"|; s|manifest=\"manifest-hello.json\"|manifest=\"manifest-hello.json?v=$V\"|; s|__BUILD__|$V|g" _site/index.html
          grep -n "manifest.*?v=\|BUILD = " _site/index.html
          cat _site/manifest.json _site/manifest-hello.json
          ls -la _site _site/firmware

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
